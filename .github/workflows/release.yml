name: Build and release
on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
permissions:
  contents: read
jobs:
  build:
    strategy:
      matrix:
        include:
          - runner: macos-15-intel
            platform: macos-x64
          - runner: macos-15
            platform: macos-arm64
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v4
      - run: cmake -S . -B build -DCMAKE_BUILD_TYPE=Release
      - run: cmake --build build --parallel
      - run: ctest --test-dir build --output-on-failure
      - run: cmake --install build --prefix "$PWD/dist/raymotion"
      - run: python3 tests/smoke_export.py "$PWD/dist/raymotion/bin/raymotion"
      - run: tar -czf raymotion-${{ matrix.platform }}.tar.gz -C dist raymotion
      - uses: actions/upload-artifact@v4
        with:
          name: raymotion-${{ matrix.platform }}
          path: raymotion-*.tar.gz
  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: raymotion-*
          merge-multiple: true
      - run: sha256sum raymotion-*.tar.gz > SHA256SUMS
      - run: gh release create "$TAG" raymotion-*.tar.gz SHA256SUMS --repo "$REPO" --generate-notes
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
          REPO: ${{ github.repository }}
